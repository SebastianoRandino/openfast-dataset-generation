  grid:
    num_y: 9
    num_z: 9
    width_m: 300.0
    height_m: 300.0
  turbsim:
    overrides:
      WrADFF: true
      WrBLFF: false
      RandSeed2: RanLux
waves:
  kind: regular
  wave_height_m: 1.0
  period_s: 6.0
  direction_deg: 0.0
controller:
  kind: template
