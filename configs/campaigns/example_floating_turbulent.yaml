# Illustrative only: not a validated scientific campaign or a framework default.
name: example-floating-turbulent
model: ../models/iea15mw_volturnus.yaml
numerics:
  integration_dt_s: 0.005
  duration_s: 1000.0
  output_dt_s: 0.02
  controller_dt_s: 0.025
  actuator_dt_s: 0.01
  wind_dt_s: 0.05
  wave_dt_s: 0.05
  discard_transient_s: 100.0
wind:
  kind: turbulent
  speed_mps: 12.0
  spectral_model: IECKAI
  iec_wind_type: NTM
  iec_turbulence_class: B
  seed_index: 1
  seed: 100001
  reference_height_m: 150.0
  generation_duration_s: 1000.0
  usable_duration_s: ALL
  template_id: example-iea15mw-turbsim-v2
  grid: {num_y: 11, num_z: 11, width_m: 300.0, height_m: 300.0}
waves:
  kind: irregular
  significant_height_m: 2.0
  peak_period_s: 8.0
  spectrum: JONSWAP
  seed: -12345
controller:
  kind: rosco
  template: ROSCO.yaml
  omega_pc: 0.10
  zeta_pc: 0.8
actuation:
  enabled: true
  delay_s: 0.0
modules: {aerodynamics: true, servodyn: true, hydrodyn: true, mooring: true}
splits: {train: {}, validation: {}, test: {}}
case_groups:
  - split: train
    sweeps:
      - mode: cartesian
        dimensions:
          wind.speed_mps: [10.0, 12.0]
          controller.omega_pc: [0.05, 0.10]
          wind.seed_index: [1, 2]
  - split: validation
    fixed: {wind.seed_index: 3}
  - split: test
    fixed: {wind.seed_index: 4}
provenance:
  openfast_version: null
  turbsim_version: null
  rosco_version: null
